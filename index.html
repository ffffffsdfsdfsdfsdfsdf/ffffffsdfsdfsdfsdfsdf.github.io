<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KNR</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      background-color: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Intro screen */
    #enter-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      z-index: 10;
      transition: opacity 1s ease;
      cursor: pointer;
    }

    #enter-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Main content */
    #main-content {
      height: 100vh;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #main-content.show {
      opacity: 1;
    }

    .swing-container {
      animation: float 10s ease-in-out infinite, fadeInUp 2s ease-out;
      transform-origin: top center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .swing-container img {
      max-height: 320px;
      width: auto;
      animation: swing 4s ease-in-out infinite;
      margin-bottom: 30px;
    }

    .title {
      font-size: 3.2rem;
      font-weight: bold;
      background: linear-gradient(90deg, #fff, #aaa, #fff);
      background-size: 200% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 4s linear infinite, glow 3s ease-in-out infinite;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #bbb;
      margin-top: 10px;
      opacity: 0.9;
      letter-spacing: 1px;
    }

    /* Animations */
    @keyframes shine {
      to { background-position: -200% center; }
    }

    @keyframes swing {
      0%   { transform: rotate(3deg); }
      50%  { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 8px #aaa; }
      50%      { text-shadow: 0 0 12px #fff; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-10px); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }
  </style>
</head>
<body>

  <!-- Music Element (hidden) -->
  <audio id="bg-music" src="the_music.mp3" loop preload="auto"></audio>

  <!-- ENTER SCREEN -->
  <div id="enter-screen">x_x</div>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <div class="swing-container">
      <img src="01d2b37f-14a4-4ba1-a5dc-04448495d12c.png" alt="Hanging Image">
      <div class="title">KNR</div>
      <div class="subtitle">2023–2025</div>
    </div>
  </div>

  <script>
    const enterScreen = document.getElementById('enter-screen');
    const mainContent = document.getElementById('main-content');
    const music = document.getElementById('bg-music');

    enterScreen.addEventListener('click', () => {
      enterScreen.classList.add('fade-out');
      setTimeout(() => {
        mainContent.classList.add('show');
        music.volume = 0.2; // start soft
        music.play().catch(e => console.log("Music autoplay blocked:", e));
      }, 1000);
    });
  </script>

</body>
</html>
